<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>camera</title>
<!--
  とけピタ君 カメラ枠（ピンチ版・ネットに置く汎用ファイル）
  使い方：cam.html?src=<カメラ画像のURL（encodeURIComponent したもの）>
  物件ごとの値（カメラURL）はこのファイルに書かない。GUI の <web url="…?src=…"> 側に書く。
  初期：高さに合わせて左右の真ん中・上辺合わせ。2本指で拡大縮小（最小＝横幅に合わせる、最大5倍）、1本指で移動。
  縮めて枠より低くなったら上下の真ん中に置き、上下にも動かせる。（zoom7.py と同じ動き）
-->
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;display:block;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
#m{position:absolute;left:0;right:0;top:45%;color:#888;font:12px sans-serif;text-align:center}
</style>
</head>
<body>
<img id="c" alt="" draggable="false">
<div id="m"></div>
<script>
var c=document.getElementById("c"),msg=document.getElementById("m"),V=0,H=0,W=0,S=1,X=0,Y=0,mn=1,mx=5,t0=null;
var q=(location.search.match(/[?&]src=([^&]*)/)||[])[1],IMG=q?decodeURIComponent(q):"";
function clamp(){var w=W*S,h=H*S;
 if(w<=V){X=(V-w)/2}else{X=Math.min(0,Math.max(V-w,X))}
 if(h<=H){Y=Math.min(H-h,Math.max(0,Y))}else{Y=Math.min(0,Math.max(H-h,Y))}
 c.style.transform="translate("+X+"px,"+Y+"px) scale("+S+")"}
function lay(){V=window.innerWidth||document.documentElement.clientWidth;H=window.innerHeight||document.documentElement.clientHeight;
 if(!V||!H||!c.naturalWidth)return;W=H*c.naturalWidth/c.naturalHeight;c.style.width=W+"px";c.style.height=H+"px";
 mn=Math.min(1,V/W);S=1;X=(V-W)/2;Y=0;clamp()}
function pts(e){var a=e.touches;return a.length>1?{x:(a[0].clientX+a[1].clientX)/2,y:(a[0].clientY+a[1].clientY)/2,d:Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY)}:{x:a[0].clientX,y:a[0].clientY,d:0}}
function start(e){t0={p:pts(e),S:S,X:X,Y:Y,n:e.touches.length}}
document.addEventListener("touchstart",function(e){start(e)},{passive:false});
document.addEventListener("touchmove",function(e){e.preventDefault();if(!t0)return;var p=pts(e);
 if(e.touches.length!==t0.n){start(e);return}
 if(t0.n>1&&t0.p.d>0){var ns=Math.min(mx,Math.max(mn,t0.S*p.d/t0.p.d)),k=ns/t0.S;
  X=p.x-(t0.p.x-t0.X)*k;Y=p.y-(t0.p.y-t0.Y)*k;S=ns}
 else{X=t0.X+(p.x-t0.p.x);Y=t0.Y+(p.y-t0.p.y)}
 clamp()},{passive:false});
document.addEventListener("touchend",function(e){if(e.touches.length)start(e);else t0=null},{passive:false});
window.addEventListener("resize",function(){lay()});
c.onload=function(){msg.textContent="";lay()};
c.onerror=function(){msg.textContent="カメラ画像を読み込めません"};
if(IMG){c.src=IMG+(IMG.indexOf("?")<0?"?":"&")+"t="+Date.now()}else{msg.textContent="src がありません"}
</script>
</body>
</html>
